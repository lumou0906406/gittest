---
- name: 批量部署 Node Exporter 监控组件
  hosts: monitor_nodes
  remote_user: root
  tasks:

    - name: 1. 下载并解压 Node Exporter
      unarchive:
        src: https://github.com/prometheus/node_exporter/releases/download/v1.6.1/node_exporter-1.6.1.linux-amd64.tar.gz
        dest: /opt/
        remote_src: yes

    - name: 2. 将二进制文件复制到 /usr/local/bin/
      copy:
        src: /opt/node_exporter-1.6.1.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        mode: '0755'
        remote_src: yes

    - name: 3. 创建 systemd 服务文件
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User=root
          ExecStart=/usr/local/bin/node_exporter --web.listen-address=:9100
          Restart=always

          [Install]
          WantedBy=multi-user.target

    - name: 4. 启动 Node Exporter 并设置开机自启
      systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes
