global:
  scrape_interval: 15s

rule_files:
  - "rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - node1:9093

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ["node1:9090"]

  - job_name: 'pushgateway'
    static_configs:
      - targets: ['node1:9091']
        labels:
          instance: pushgateway

  - job_name: 'node_exporter'
    static_configs:
      - targets:
          - node1:9100
          - node2:9100
          - node3:9100

  - job_name: 'kube-state-metrics'
    honor_labels: true
    static_configs:
      - targets: ["10.244.2.96:8080"]

  - job_name: 'mysql'
    static_configs:
      - targets: ['192.168.88.132:9104']
        labels:
          env: 'production'

  - job_name: 'nginx'
    static_configs:
      - targets: ['192.168.88.131:9113']
        labels:
          env: 'production'
          service: 'nginx'        
