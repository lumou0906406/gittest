global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.qq.com:465'
  smtp_from: 'email@qq.com'
  smtp_auth_username: '@qq.com'
  smtp_auth_password: ''
  smtp_require_tls: false

# 告警路由
route:
  group_by: ['alertname', 'severity', 'instance']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'email-notify'
  routes:
    # critical 告警走钉钉
    - match:
        severity: critical
      receiver: 'dingtalk-notify'
      group_wait: 10s
      repeat_interval: 1h
    # warning 告警走邮件
    - match:
        severity: warning
      receiver: 'email-notify'
      repeat_interval: 4h

# 接收器
receivers:
  - name: 'email-notify'
    email_configs:
      - to: '3142156341@qq.com'
        send_resolved: true

  - name: 'dingtalk-notify'
    webhook_configs:
      - url: 'http://127.0.0.1:8060/dingtalk/webhook1/send'
        send_resolved: true

# 抑制规则
inhibit_rules:
  # 规则1：critical 告警存在时，抑制同 alertname 同 instance 的 warning 告警
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  # 规则2：MySQL 宕机时，抑制其他 MySQL 相关告警
  - source_match:
      alertname: 'MySQLDown'
      severity: 'critical'
    target_match_re:
      alertname: 'MySQL.*'
    equal: ['instance']

  # 规则3：节点宕机时，抑制该节点上所有其他告警
  - source_match:
      alertname: 'NodeInstanceDown'
      severity: 'critical'
    target_match_re:
      alertname: '.*'
    equal: ['instance']
